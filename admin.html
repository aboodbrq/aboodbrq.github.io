<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAZg3k6l1HE-uMDVIzorSo4mTm6P2Is1MY",
    authDomain: "abdullah-profile-9e0e6.firebaseapp.com",
    projectId: "abdullah-profile-9e0e6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
</script>

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: #f2f4f7;
    padding: 20px;
}
input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    padding: 10px 20px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}
#adminPanel { display: none; }
.company-card {
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
    border: 1px solid #ddd;
}
</style>
</head>

<body>

<h2>تسجيل الدخول</h2>
<div id="loginBox">
    <input id="email" placeholder="البريد">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
</div>

<div id="adminPanel">

<h2>بياناتي الشخصية</h2>

<input id="name" placeholder="الاسم">
<input id="title" placeholder="المسمى الوظيفي">
<input id="phone" placeholder="رقم الجوال">
<input id="email2" placeholder="البريد">
<input id="whatsapp" placeholder="واتساب">
<input id="snapchat" placeholder="سناب">
<input id="youtube" placeholder="يوتيوب">
<input id="instagram" placeholder="إنستغرام">
<input id="linkedin" placeholder="لينكدإن">
<input id="qr" placeholder="رابط QR">

<button onclick="saveProfile()">حفظ البيانات</button>

<hr>

<h2>إضافة شركة جديدة</h2>

<input id="c_name" placeholder="اسم الشركة">
<textarea id="c_desc" placeholder="وصف الشركة"></textarea>

<input id="c_phone" placeholder="رقم الجوال">
<input id="c_email" placeholder="البريد">
<input id="c_whatsapp" placeholder="واتساب">
<input id="c_location" placeholder="رابط الموقع على الخريطة">

<input id="c_instagram" placeholder="إنستغرام">
<input id="c_twitter" placeholder="تويتر">
<input id="c_facebook" placeholder="فيسبوك">
<input id="c_linkedin" placeholder="لينكدإن">

<button onclick="addCompany()">إضافة الشركة</button>

<h2>الشركات الحالية</h2>
<div id="companiesList"></div>

</div>

<script>
function login() {
    const emailVal = document.getElementById("email").value;
    const passVal = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(emailVal, passVal)
    .then(() => {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadCompanies();
    })
    .catch((err) => {
        alert("خطأ في تسجيل الدخول");
        console.log(err);
    });
}

function saveProfile() {
    db.collection("settings").doc("profile").set({
        name: name.value,
        title: title.value,
        phone: phone.value,
        email: email2.value,
        whatsapp: whatsapp.value,
        snapchat: snapchat.value,
        youtube: youtube.value,
        instagram: instagram.value,
        linkedin: linkedin.value,
        qr: qr.value
    }).then(() => alert("تم حفظ البيانات"));
}

function addCompany() {
    db.collection("companies").add({
        name: c_name.value,
        desc: c_desc.value,
        phone: c_phone.value,
        email: c_email.value,
        whatsapp: c_whatsapp.value,
        location: c_location.value,
        instagram: c_instagram.value,
        twitter: c_twitter.value,
        facebook: c_facebook.value,
        linkedin: c_linkedin.value
    }).then(() => {
        alert("تمت إضافة الشركة");
        loadCompanies();
    });
}

function loadCompanies() {
    companiesList.innerHTML = "";
    db.collection("companies").get().then(snapshot => {
        snapshot.forEach(doc => {
            const c = doc.data();
            const card = document.createElement("div");
            card.className = "company-card";
            card.innerHTML = `
                <strong>${c.name}</strong><br>
                ${c.desc}<br><br>
                <button onclick="deleteCompany('${doc.id}')">حذف</button>
            `;
            companiesList.appendChild(card);
        });
    });
}

function deleteCompany(id) {
    db.collection("companies").doc(id).delete().then(() => {
        alert("تم حذف الشركة");
        loadCompanies();
    });
}
</script>

</body>
</html>
