<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم — عبدالله مفيد يبرق</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="firebase.js"></script>

<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: #f2f4f7;
    padding: 20px;
}
h2 { margin-top: 20px; }
input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
}
button {
    padding: 10px 20px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    font-size: 0.9rem;
}
button.secondary {
    background: #6c757d;
}
#adminPanel { display: none; }
.company-card {
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
    border: 1px solid #ddd;
}
.company-card strong { display:block; margin-bottom:6px; }
.top-bar{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
}
</style>
</head>

<body>

<div class="top-bar">
  <h2>لوحة التحكم</h2>
  <button class="secondary" onclick="location.href='index.html'">العودة للموقع</button>
</div>

<h3>تسجيل الدخول</h3>
<div id="loginBox">
    <input id="email" placeholder="البريد">
    <input id="password" type="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
</div>

<div id="adminPanel">

<h3>بياناتي الشخصية</h3>

<input id="name" placeholder="الاسم">
<input id="title" placeholder="المسمى الوظيفي">
<input id="phone" placeholder="رقم الجوال">
<input id="email2" placeholder="البريد">
<input id="whatsapp" placeholder="واتساب (بدون +966)">
<input id="snapchat" placeholder="سناب">
<input id="youtube" placeholder="يوتيوب">
<input id="instagram" placeholder="إنستغرام">
<input id="linkedin" placeholder="لينكدإن">
<input id="qr" placeholder="رابط صورة QR">

<button onclick="saveProfile()">حفظ البيانات</button>

<hr>

<h3>إضافة شركة جديدة</h3>

<input id="c_name" placeholder="اسم الشركة">
<textarea id="c_desc" placeholder="وصف الشركة"></textarea>

<input id="c_phone" placeholder="رقم الجوال">
<input id="c_email" placeholder="البريد">
<input id="c_whatsapp" placeholder="واتساب (بدون +966)">
<input id="c_location" placeholder="رابط الموقع على الخريطة">

<input id="c_instagram" placeholder="إنستغرام">
<input id="c_twitter" placeholder="تويتر">
<input id="c_facebook" placeholder="فيسبوك">
<input id="c_linkedin" placeholder="لينكدإن">

<button onclick="addCompany()">إضافة الشركة</button>

<h3>الشركات الحالية</h3>
<div id="companiesList"></div>

</div>

<script>
function login() {
    const emailVal = document.getElementById("email").value;
    const passVal = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(emailVal, passVal)
    .then(() => {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadProfile();
        loadCompanies();
    })
    .catch((err) => {
        alert("خطأ في تسجيل الدخول");
        console.log(err);
    });
}

function loadProfile() {
    db.collection("settings").doc("profile").get().then(doc => {
        if (!doc.exists) return;
        const p = doc.data();
        name.value      = p.name      || "";
        title.value     = p.title     || "";
        phone.value     = p.phone     || "";
        email2.value    = p.email     || "";
        whatsapp.value  = p.whatsapp  || "";
        snapchat.value  = p.snapchat  || "";
        youtube.value   = p.youtube   || "";
        instagram.value = p.instagram || "";
        linkedin.value  = p.linkedin  || "";
        qr.value        = p.qr        || "";
    });
}

function saveProfile() {
    db.collection("settings").doc("profile").set({
        name: name.value,
        title: title.value,
        phone: phone.value,
        email: email2.value,
        whatsapp: whatsapp.value,
        snapchat: snapchat.value,
        youtube: youtube.value,
        instagram: instagram.value,
        linkedin: linkedin.value,
        qr: qr.value
    }).then(() => alert("تم حفظ البيانات"));
}

function addCompany() {
    db.collection("companies").add({
        name: c_name.value,
        desc: c_desc.value,
        phone: c_phone.value,
        email: c_email.value,
        whatsapp: c_whatsapp.value,
        location: c_location.value,
        instagram: c_instagram.value,
        twitter: c_twitter.value,
        facebook: c_facebook.value,
        linkedin: c_linkedin.value
    }).then(() => {
        alert("تمت إضافة الشركة");
        clearCompanyForm();
        loadCompanies();
    });
}

function clearCompanyForm() {
    c_name.value = "";
    c_desc.value = "";
    c_phone.value = "";
    c_email.value = "";
    c_whatsapp.value = "";
    c_location.value = "";
    c_instagram.value = "";
    c_twitter.value = "";
    c_facebook.value = "";
    c_linkedin.value = "";
}

function loadCompanies() {
    companiesList.innerHTML = "";
    db.collection("companies").get().then(snapshot => {
        snapshot.forEach(doc => {
            const c = doc.data();
            const card = document.createElement("div");
            card.className = "company-card";
            card.innerHTML = `
                <strong>${c.name || "شركة بدون اسم"}</strong>
                <div>${c.desc || ""}</div>
                <button onclick="deleteCompany('${doc.id}')">حذف</button>
            `;
            companiesList.appendChild(card);
        });
    });
}

function deleteCompany(id) {
    if (!confirm("هل تريد حذف هذه الشركة؟")) return;
    db.collection("companies").doc(id).delete().then(() => {
        alert("تم حذف الشركة");
        loadCompanies();
    });
}
</script>

</body>
</html>
